name: Build Work Profile Cloner
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Prep Project
        run: |
          # فك أي ملف زيب موجود مهما كان اسمه
          unzip -o *.zip -d .
          
          # تثبيت المكتبات وبناء ملفات الويب
          npm install --legacy-peer-deps
          npm run build
          
          # إنشاء مشروع الأندرويد أو تحديثه
          npx cap add android || true
          
          # التأكد من وجود المجلدات قبل النقل
          mkdir -p android/app/src/main/java/com/mohamed/cloner
          
          # نقل ملفات الجافا والـ Manifest للأماكن الصح (لو موجودة في الزيب)
          cp android/app/src/main/java/com/mohamed/cloner/MainActivity.java android/app/src/main/java/com/mohamed/cloner/MainActivity.java || true
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-WorkProfile
          path: "android/app/build/outputs/apk/debug/*.apk"
          
