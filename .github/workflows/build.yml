name: Build Work Profile Cloner
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Extract and Organize
        run: |
          # 1. فك ضغط أي ملف زيب
          unzip -o *.zip -d temp_folder
          
          # 2. البحث عن ملف package.json ونقل كل حاجة لمكانها الصح
          PACKAGE_PATH=$(find temp_folder -name "package.json" | head -n 1)
          if [ -n "$PACKAGE_PATH" ]; then
            BASE_DIR=$(dirname "$PACKAGE_PATH")
            cp -r "$BASE_DIR"/* .
            cp -r "$BASE_DIR"/.* . || true
          fi
          
          # بنشوف إحنا فين دلوقتي
          ls -F

      - name: Install and Build Project
        run: |
          # تثبيت الأدوات الأساسية
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli @capacitor/android
          
          # بناء ملفات الويب (شرط أساسي لـ Capacitor)
          npm run build
          
          # مسح أي مشروع أندرويد قديم وبناء واحد جديد تماماً
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          # التأكد من وجود ملف gradlew قبل البدء
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Error: gradlew file still not found!"
            ls -R android || echo "Android folder is empty!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-WorkProfile
          path: "android/app/build/outputs/apk/debug/*.apk"
          
