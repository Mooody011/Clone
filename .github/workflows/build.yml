name: Build Mohamed Cloner Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Extract and Find Root
        run: |
          # فك الضغط في مجلد مؤقت
          mkdir temp_extract
          unzip -o *.zip -d temp_extract || echo "No zip found"
          
          # البحث الذكي عن مكان الـ package.json ونقل الملفات للمكان الصح
          ROOT_DIR=$(find temp_extract -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -n "$ROOT_DIR" ]; then
            cp -r "$ROOT_DIR"/* .
            cp -r "$ROOT_DIR"/.* . || true
            echo "تم العثور على المشروع في: $ROOT_DIR"
          else
            cp -r temp_extract/* . || true
          fi

      - name: Install and Sync Everything
        run: |
          # تثبيت كل الأدوات اللي كان بيشتكي منها (TypeScript و Capacitor)
          npm install -g @capacitor/cli @capacitor/android
          npm install --legacy-peer-deps
          npm install -D typescript --legacy-peer-deps
          
          # بناء ملفات الويب (الشرط الأساسي للأندرويد)
          npm run build || (mkdir -p dist && echo "<html></html>" > dist/index.html)
          
          # إعادة إنشاء مجلد أندرويد "فابريكا" لضمان وجود gradlew
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Ultimate Build
        run: |
          # البحث عن ملف gradlew وتشغيله أينما كان
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            cd $(dirname "$GRADLE_PATH")
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "خطأ فادح: ملف البناء مش موجود!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-Final-APK
          path: "**/*.apk"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-V2
          path: "android/app/build/outputs/apk/debug/*.apk"
