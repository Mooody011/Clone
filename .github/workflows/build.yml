name: Build Mohamed Cloner Pro V11
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Create Pro Bridge UI
        run: |
          mkdir -p dist
          cat <<EOF > dist/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ناسخ محمد V11</title>
              <style>
                  body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
                  .header { background: #fff; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
                  .btn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
                  .app-item { background: #fff; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
                  .mode-badge { padding: 10px; border-radius: 10px; text-align: center; margin-bottom: 15px; font-weight: bold; }
                  .work { background: #d4edda; color: #155724; }
                  .personal { background: #fff3cd; color: #856404; }
              </style>
          </head>
          <body>
              <div class="header"><h1>ناسخ محمد V11 🌉</h1></div>
              <div id="status" class="mode-badge">جاري التحقق...</div>
              <div id="actions"></div>
              <div id="app-list"></div>
              <script>
                  function updateUI(isWork) {
                      const status = document.getElementById('status');
                      const actions = document.getElementById('actions');
                      if(isWork) {
                          status.innerText = "✅ وضع العمل (مستقبل الأوامر)";
                          status.className = "mode-badge work";
                          actions.innerHTML = '<p style="text-align:center">النسخة دي جاهزة لاستلام التطبيقات من النسخة الشخصية</p>';
                      } else {
                          status.innerText = "🏠 الوضع الشخصي (مُرسل الأوامر)";
                          status.className = "mode-badge personal";
                          actions.innerHTML = '<button class="btn" style="background:#e74c3c" onclick="activate()">1. تفعيل المساحة (أول مرة) 🛠️</button><button class="btn" style="background:#28a745" onclick="load()">2. عرض وتحديث تطبيقات الجهاز 🔄</button>';
                      }
                  }
                  function activate() { if(window.AndroidBridge) window.AndroidBridge.activateProfile(); }
                  function load() { if(window.AndroidBridge) window.AndroidBridge.getInstalledApps(); }
                  window.handleAppsResponse = (base64) => {
                      const apps = JSON.parse(decodeURIComponent(escape(atob(base64))));
                      const container = document.getElementById('app-list');
                      container.innerHTML = '';
                      apps.forEach(app => {
                          container.innerHTML += '<div class="app-item"><div><b>'+app.name+'</b><br><small>'+app.package+'</small></div><button class="btn" style="width:auto; padding:8px 15px;" onclick="clone(\''+app.package+'\')">نسخ</button></div>';
                      });
                  };
                  function clone(pkg) { if(window.AndroidBridge) window.AndroidBridge.cloneApp(pkg); }
                  window.onload = () => { setTimeout(() => { if(window.AndroidBridge) window.AndroidBridge.checkMode(); }, 1000); };
              </script>
          </body>
          </html>
          EOF
          echo '{"appId":"com.mohamed.cloner","appName":"Mohamed Cloner","webDir":"dist"}' > capacitor.config.json
          echo '{"name":"app","dependencies":{"@capacitor/android":"6.0.0","@capacitor/core":"6.0.0","@capacitor/cli":"6.0.0"}}' > package.json

      - name: Build and Inject Bridge Logic
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli
          npx cap add android
          
          # جافا: كود الجسر الذكي (Cross-Profile)
          mkdir -p android/app/src/main/java/com/mohamed/cloner
          cat <<EOF > android/app/src/main/java/com/mohamed/cloner/MainActivity.java
          package com.mohamed.cloner;
          import android.os.*;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import android.content.pm.*;
          import android.app.admin.*;
          import android.content.*;
          import android.util.Base64;
          import org.json.*;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final String ACTION_CLONE = "com.mohamed.cloner.ACTION_CLONE";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleIntent(getIntent());
                  
                  this.getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void checkMode() {
                          runOnUiThread(() -> {
                              UserManager um = (UserManager) getSystemService(Context.USER_SERVICE);
                              getBridge().getWebView().evaluateJavascript("updateUI(" + um.isManagedProfile() + ")", null);
                          });
                      }
                      @JavascriptInterface
                      public void activateProfile() {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE);
                              intent.putExtra(DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, new ComponentName(MainActivity.this, MyDeviceAdminReceiver.class));
                              startActivityForResult(intent, 555);
                          });
                      }
                      @JavascriptInterface
                      public void getInstalledApps() {
                          runOnUiThread(() -> {
                              try {
                                  PackageManager pm = getPackageManager();
                                  List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                                  JSONArray array = new JSONArray();
                                  for (ApplicationInfo app : apps) {
                                      if ((app.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                                          JSONObject obj = new JSONObject();
                                          obj.put("name", app.loadLabel(pm).toString());
                                          obj.put("package", app.packageName);
                                          array.put(obj);
                                      }
                                  }
                                  String b64 = Base64.encodeToString(array.toString().getBytes("UTF-8"), Base64.NO_WRAP);
                                  getBridge().getWebView().evaluateJavascript("window.handleAppsResponse('" + b64 + "')", null);
                              } catch (Exception e) {}
                          });
                      }
                      @JavascriptInterface
                      public void cloneApp(String pkg) {
                          runOnUiThread(() -> {
                              UserManager um = (UserManager) getSystemService(Context.USER_SERVICE);
                              if (!um.isManagedProfile()) {
                                  // نحن في الوضع الشخصي: نرسل الأمر للوضع المعزول
                                  Intent intent = new Intent(ACTION_CLONE);
                                  intent.putExtra("pkg", pkg);
                                  // هذا سيفتح التطبيق في مساحة العمل تلقائياً
                                  startActivity(intent);
                                  android.widget.Toast.makeText(MainActivity.this, "تم إرسال أمر النسخ لمساحة العمل...", 0).show();
                              } else {
                                  executeClone(pkg);
                              }
                          });
                      }
                  }, "AndroidBridge");
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent != null && ACTION_CLONE.equals(intent.getAction())) {
                      String pkg = intent.getStringExtra("pkg");
                      if (pkg != null) executeClone(pkg);
                  }
              }

              private void executeClone(String pkg) {
                  try {
                      DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName admin = new ComponentName(this, MyDeviceAdminReceiver.class);
                      dpm.installExistingPackage(admin, pkg);
                      android.widget.Toast.makeText(this, "🚀 تم استنساخ " + pkg + " بنجاح!", 0).show();
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "❌ خطأ في النسخ: " + e.getMessage(), 1).show();
                  }
              }
          }
          EOF

          # المانيفست مع فلاتر الاستقبال العابرة للملفات الشخصية
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mohamed.cloner">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Mohamed Cloner" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name="com.mohamed.cloner.MainActivity" android:exported="true" android:theme="@style/AppTheme.NoActionBarLaunch" android:launchMode="singleTop">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                      <intent-filter>
                          <action android:name="com.mohamed.cloner.ACTION_CLONE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".MyDeviceAdminReceiver" android:label="Work Admin" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # المستقبل (Receiver) مع تفعيل فلاتر التواصل بين الملفات
          cat <<EOF > android/app/src/main/java/com/mohamed/cloner/MyDeviceAdminReceiver.java
          package com.mohamed.cloner;
          import android.app.admin.*;
          import android.content.*;
          public class MyDeviceAdminReceiver extends DeviceAdminReceiver {
              @Override
              public void onProfileProvisioningComplete(Context context, Intent intent) {
                  DevicePolicyManager manager = (DevicePolicyManager) context.getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName componentName = new ComponentName(context, MyDeviceAdminReceiver.class);
                  manager.setProfileEnabled(componentName);
                  
                  // السماح للأوامر بالانتقال من الشخصي إلى العمل
                  IntentFilter filter = new IntentFilter("com.mohamed.cloner.ACTION_CLONE");
                  manager.addCrossProfileIntentFilter(componentName, filter, DevicePolicyManager.FLAG_PARENT_CAN_ACCESS_MANAGED);
              }
          }
          EOF
          mkdir -p android/app/src/main/res/xml
          echo '<device-admin></device-admin>' > android/app/src/main/res/xml/device_admin.xml
          sed -i 's/versionCode 1/versionCode 60/g' android/app/build.gradle
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-V11
          path: "android/app/build/outputs/apk/debug/*.apk"
          
