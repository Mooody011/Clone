name: Build Standalone App Cloner Android 16

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Project Files and Build APK
        run: |
          # 1. إنشاء الفولدرات
          mkdir -p app/src/main/java/com/mohamed/cloner
          mkdir -p app/src/main/assets

          # 2. توليد مفتاح وشهادة التوقيع
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 10000 -subj "/CN=MohamedCloner/O=Mohamed/C=EG"
          openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out app/src/main/assets/cloner.pk8 -nocrypt
          openssl x509 -inform PEM -outform DER -in cert.pem -out app/src/main/assets/cloner.x509.der
          rm -f key.pem cert.pem

          # 3. إنشاء ملف settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MohamedCloner"
          include ':app'
          EOF

          # 4. إنشاء ملف gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          # 5. إنشاء ملف build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 6. إنشاء ملف app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohamed.cloner'
              compileSdk 36

              defaultConfig {
                  applicationId "com.mohamed.cloner"
                  minSdk 26
                  targetSdk 36
                  versionCode 3
                  versionName "3.0-Aligned"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                  }
              }
          }

          dependencies {
              implementation 'com.android.tools.build:apksig:8.5.2'
          }
          EOF

          # 7. إنشاء ملف AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
                  android:label="ناسخ التطبيقات المستقل - محمد"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".InstallReceiver"
                      android:exported="true" />

              </application>
          </manifest>
          EOF

          # 8. إنشاء مستقبل التثبيت InstallReceiver.kt
          cat << 'EOF' > app/src/main/java/com/mohamed/cloner/InstallReceiver.kt
          package com.mohamed.cloner

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.os.Build
          import android.widget.Toast

          class InstallReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (val status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, -1)) {
                      PackageInstaller.STATUS_PENDING_USER_ACTION -> {
                          val confirmIntent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              intent.getParcelableExtra(Intent.EXTRA_INTENT, Intent::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent.getParcelableExtra(Intent.EXTRA_INTENT)
                          }
                          if (confirmIntent != null) {
                              confirmIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(confirmIntent)
                          }
                      }
                      PackageInstaller.STATUS_SUCCESS -> {
                          Toast.makeText(context, "تم تثبيت النسخة المستقلة بنجاح!", Toast.LENGTH_LONG).show()
                      }
                      else -> {
                          val msg = intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE) ?: "خطأ رقم $status"
                          Toast.makeText(context, "لم يكتمل التثبيت: $msg", Toast.LENGTH_LONG).show()
                      }
                  }
              }
          }
          EOF

          # 9. إنشاء محرك تعديل المانيفيست AxmlPatcher.kt
          cat << 'EOF' > app/src/main/java/com/mohamed/cloner/AxmlPatcher.kt
          package com.mohamed.cloner

          import java.io.ByteArrayOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object AxmlPatcher {

              fun patchManifest(data: ByteArray, cloneNum: Int, newAppLabel: String): Pair<ByteArray, String> {
                  if (data.size < 36 || readU16(data, 0) != 0x0003) {
                      throw IllegalArgumentException("ملف AndroidManifest غير صالح")
                  }

                  val spPos = readU16(data, 2)
                  if (readU16(data, spPos) != 0x0001) {
                      throw IllegalArgumentException("لم يتم العثور على جدول النصوص StringPool")
                  }

                  val spHeaderSize = readU16(data, spPos + 2)
                  val spSize = readInt(data, spPos + 4)
                  val stringCount = readInt(data, spPos + 8)
                  val flags = readInt(data, spPos + 16)
                  val stringsStart = readInt(data, spPos + 20)
                  val isUtf8 = (flags and 0x100) != 0

                  val strings = ArrayList<String>(stringCount + 64)
                  for (i in 0 until stringCount) {
                      val offset = readInt(data, spPos + spHeaderSize + i * 4)
                      val strPos = spPos + stringsStart + offset
                      if (isUtf8) {
                          var p = strPos
                          val b1 = data[p++].toInt() and 0xFF
                          if ((b1 and 0x80) != 0) p++
                          var bLen = data[p++].toInt() and 0xFF
                          if ((bLen and 0x80) != 0) {
                              bLen = ((bLen and 0x7F) shl 8) or (data[p++].toInt() and 0xFF)
                          }
                          strings.add(String(data, p, bLen, Charsets.UTF_8))
                      } else {
                          var p = strPos
                          var cLen = readU16(data, p)
                          p += 2
                          if ((cLen and 0x8000) != 0) {
                              cLen = ((cLen and 0x7FFF) shl 16) or readU16(data, p)
                              p += 2
                          }
                          strings.add(String(data, p, cLen * 2, Charsets.UTF_16LE))
                      }
                  }

                  val originalCount = strings.size
                  fun addNewString(s: String): Int {
                      for (idx in originalCount until strings.size) {
                          if (strings[idx] == s) return idx
                      }
                      strings.add(s)
                      return strings.size - 1
                  }

                  val afterSpPos = spPos + spSize
                  val rest = data.copyOfRange(afterSpPos, data.size)

                  var resIds = IntArray(0)
                  var origPackage = ""
                  val declaredPerms = HashSet<String>()

                  fun getAttrString(aPos: Int): String? {
                      val rawVal = readInt(rest, aPos + 8)
                      val dType = rest[aPos + 15].toInt() and 0xFF
                      val dVal = readInt(rest, aPos + 16)
                      return when {
                          rawVal >= 0 -> strings.getOrNull(rawVal)
                          dType == 0x03 -> strings.getOrNull(dVal)
                          else -> null
                      }
                  }

                  // المرحلة الأولى: قراءة الـ Resource IDs واسم الحزمة والصلاحيات المعرفة
                  var pos = 0
                  while (pos + 8 <= rest.size) {
                      val cType = readU16(rest, pos)
                      val cHeaderSize = readU16(rest, pos + 2)
                      val cSize = readInt(rest, pos + 4)
                      if (cSize <= 0 || pos + cSize > rest.size) break

                      if (cType == 0x0180) {
                          val count = (cSize - cHeaderSize) / 4
                          resIds = IntArray(count) { k -> readInt(rest, pos + cHeaderSize + k * 4) }
                      } else if (cType == 0x0102) {
                          val elemNameIdx = readInt(rest, pos + cHeaderSize + 4)
                          val elemName = strings.getOrNull(elemNameIdx) ?: ""
                          val attrStart = readU16(rest, pos + cHeaderSize + 8)
                          val attrSize = readU16(rest, pos + cHeaderSize + 10)
                          val attrCount = readU16(rest, pos + cHeaderSize + 12)

                          for (i in 0 until attrCount) {
                              val aPos = pos + cHeaderSize + attrStart + i * attrSize
                              val aNameIdx = readInt(rest, aPos + 4)
                              val aName = strings.getOrNull(aNameIdx) ?: ""
                              val aResId = if (aNameIdx in resIds.indices) resIds[aNameIdx] else 0
                              val curVal = getAttrString(aPos)

                              if (elemName == "manifest" && aName == "package" && !curVal.isNullOrEmpty()) {
                                  origPackage = curVal
                              } else if (elemName in listOf("permission", "permission-group", "permission-tree")) {
                                  if ((aName == "name" || aResId == 0x01010003) && !curVal.isNullOrEmpty()) {
                                      declaredPerms.add(curVal)
                                  }
                              }
                          }
                      }
                      pos += cSize
                  }

                  if (origPackage.isEmpty()) {
                      throw IllegalStateException("تعذر قراءة اسم حزمة التطبيق الأصلي")
                  }

                  val suffix = ".cln$cloneNum"
                  val newPackage = origPackage + suffix

                  fun mapPermissionName(perm: String): String {
                      return when {
                          perm.contains(origPackage) -> perm.replace(origPackage, newPackage)
                          perm in declaredPerms -> perm + suffix
                          else -> perm
                      }
                  }

                  fun setAttrString(aPos: Int, value: String) {
                      val newIdx = addNewString(value)
                      writeInt(rest, aPos + 8, newIdx)
                      writeU16(rest, aPos + 12, 8)
                      rest[aPos + 14] = 0
                      rest[aPos + 15] = 0x03
                      writeInt(rest, aPos + 16, newIdx)
                  }

                  fun setAttrBoolean(aPos: Int, boolVal: Boolean) {
                      writeInt(rest, aPos + 8, -1)
                      writeU16(rest, aPos + 12, 8)
                      rest[aPos + 14] = 0
                      rest[aPos + 15] = 0x12
                      writeInt(rest, aPos + 16, if (boolVal) -1 else 0)
                  }

                  // المرحلة الثانية: تعديل الحزمة، الاسم، الكلاسات، الـ Authorities، والـ Permissions
                  pos = 0
                  while (pos + 8 <= rest.size) {
                      val cType = readU16(rest, pos)
                      val cHeaderSize = readU16(rest, pos + 2)
                      val cSize = readInt(rest, pos + 4)
                      if (cSize <= 0 || pos + cSize > rest.size) break

                      if (cType == 0x0102) {
                          val elemNameIdx = readInt(rest, pos + cHeaderSize + 4)
                          val elemName = strings.getOrNull(elemNameIdx) ?: ""
                          val attrStart = readU16(rest, pos + cHeaderSize + 8)
                          val attrSize = readU16(rest, pos + cHeaderSize + 10)
                          val attrCount = readU16(rest, pos + cHeaderSize + 12)

                          for (i in 0 until attrCount) {
                              val aPos = pos + cHeaderSize + attrStart + i * attrSize
                              val aNameIdx = readInt(rest, aPos + 4)
                              val aName = strings.getOrNull(aNameIdx) ?: ""
                              val aResId = if (aNameIdx in resIds.indices) resIds[aNameIdx] else 0
                              val curVal = getAttrString(aPos)

                              when (elemName) {
                                  "manifest" -> {
                                      if (aName == "package") {
                                          setAttrString(aPos, newPackage)
                                      } else if (aName == "sharedUserId" || aResId == 0x0101000b) {
                                          if (!curVal.isNullOrEmpty()) setAttrString(aPos, curVal + suffix)
                                      } else if (aName == "isSplitRequired" || aResId == 0x01010591) {
                                          setAttrBoolean(aPos, false)
                                      }
                                  }
                                  "application" -> {
                                      if (aName == "label" || aResId == 0x01010001) {
                                          setAttrString(aPos, newAppLabel)
                                      } else if (aName == "extractNativeLibs" || aResId == 0x010104ea) {
                                          setAttrBoolean(aPos, true)
                                      } else if (aName == "isSplitRequired" || aResId == 0x01010591) {
                                          setAttrBoolean(aPos, false)
                                      } else if (aName in listOf("name", "backupAgent", "manageSpaceActivity", "appComponentFactory") ||
                                          aResId in listOf(0x01010003, 0x0101027f, 0x01010004, 0x0101057a)) {
                                          if (!curVal.isNullOrEmpty()) {
                                              if (curVal.startsWith(".")) {
                                                  setAttrString(aPos, origPackage + curVal)
                                              } else if (!curVal.contains(".")) {
                                                  setAttrString(aPos, "$origPackage.$curVal")
                                              }
                                          }
                                      }
                                  }
                                  "activity", "activity-alias", "service", "receiver", "provider" -> {
                                      if (aName in listOf("name", "targetActivity") || aResId in listOf(0x01010003, 0x01010202)) {
                                          if (!curVal.isNullOrEmpty()) {
                                              if (curVal.startsWith(".")) {
                                                  setAttrString(aPos, origPackage + curVal)
                                              } else if (!curVal.contains(".")) {
                                                  setAttrString(aPos, "$origPackage.$curVal")
                                              }
                                          }
                                      } else if (elemName == "provider" && (aName == "authorities" || aResId == 0x01010018)) {
                                          if (!curVal.isNullOrEmpty()) {
                                              val newAuth = curVal.split(";").joinToString(";") { part ->
                                                  if (part.contains(origPackage)) part.replace(origPackage, newPackage)
                                                  else part + suffix
                                              }
                                              setAttrString(aPos, newAuth)
                                          }
                                      }
                                  }
                                  "permission", "permission-group", "permission-tree" -> {
                                      if ((aName == "name" || aResId == 0x01010003) && !curVal.isNullOrEmpty()) {
                                          setAttrString(aPos, mapPermissionName(curVal))
                                      } else if ((aName == "permissionGroup" || aResId == 0x0101000a) && !curVal.isNullOrEmpty()) {
                                          setAttrString(aPos, mapPermissionName(curVal))
                                      }
                                  }
                                  "uses-permission", "uses-permission-sdk-23" -> {
                                      if ((aName == "name" || aResId == 0x01010003) && !curVal.isNullOrEmpty()) {
                                          val mapped = mapPermissionName(curVal)
                                          if (mapped != curVal) setAttrString(aPos, mapped)
                                      }
                                  }
                                  "meta-data" -> {
                                      if ((aName == "name" || aResId == 0x01010003) && !curVal.isNullOrEmpty()) {
                                          if (curVal.startsWith("com.android.vending.splits") || curVal.startsWith("com.android.stamp")) {
                                              setAttrString(aPos, "disabled.$curVal")
                                          }
                                      }
                                  }
                              }

                              if (aName in listOf("permission", "readPermission", "writePermission", "targetPackage", "taskAffinity", "process") ||
                                  aResId in listOf(0x01010006, 0x01010007, 0x01010008, 0x01010021, 0x01010012, 0x01010011)) {
                                  if (!curVal.isNullOrEmpty()) {
                                      val mapped = mapPermissionName(curVal)
                                      if (mapped != curVal) setAttrString(aPos, mapped)
                                  }
                              }
                          }
                      }
                      pos += cSize
                  }

                  // المرحلة الثالثة: إعادة بناء جدول النصوص StringPool بصيغة UTF-16LE القياسية
                  val strDataOut = ByteArrayOutputStream()
                  val offsets = IntArray(strings.size)
                  for (i in strings.indices) {
                      offsets[i] = strDataOut.size()
                      val s = strings[i]
                      val charLen = s.length
                      if (charLen < 0x8000) {
                          writeU16Stream(strDataOut, charLen)
                      } else {
                          writeU16Stream(strDataOut, 0x8000 or (charLen ushr 16))
                          writeU16Stream(strDataOut, charLen and 0xFFFF)
                      }
                      strDataOut.write(s.toByteArray(Charsets.UTF_16LE))
                      writeU16Stream(strDataOut, 0)
                  }
                  while (strDataOut.size() % 4 != 0) {
                      strDataOut.write(0)
                  }

                  val strBytes = strDataOut.toByteArray()
                  val newSpHeaderSize = 28
                  val newStringsStart = newSpHeaderSize + strings.size * 4
                  val newSpSize = newStringsStart + strBytes.size
                  val totalSize = 8 + newSpSize + rest.size

                  val outBuf = ByteBuffer.allocate(totalSize).order(ByteOrder.LITTLE_ENDIAN)
                  outBuf.putShort(0x0003.toShort())
                  outBuf.putShort(0x0008.toShort())
                  outBuf.putInt(totalSize)

                  outBuf.putShort(0x0001.toShort())
                  outBuf.putShort(newSpHeaderSize.toShort())
                  outBuf.putInt(newSpSize)
                  outBuf.putInt(strings.size)
                  outBuf.putInt(0)
                  outBuf.putInt(0)
                  outBuf.putInt(newStringsStart)
                  outBuf.putInt(0)

                  for (off in offsets) {
                      outBuf.putInt(off)
                  }
                  outBuf.put(strBytes)
                  outBuf.put(rest)

                  return Pair(outBuf.array(), newPackage)
              }

              private fun readU16(b: ByteArray, offset: Int): Int {
                  return (b[offset].toInt() and 0xFF) or ((b[offset + 1].toInt() and 0xFF) shl 8)
              }

              private fun readInt(b: ByteArray, offset: Int): Int {
                  return (b[offset].toInt() and 0xFF) or
                          ((b[offset + 1].toInt() and 0xFF) shl 8) or
                          ((b[offset + 2].toInt() and 0xFF) shl 16) or
                          ((b[offset + 3].toInt() and 0xFF) shl 24)
              }

              private fun writeU16(b: ByteArray, offset: Int, value: Int) {
                  b[offset] = (value and 0xFF).toByte()
                  b[offset + 1] = ((value ushr 8) and 0xFF).toByte()
              }

              private fun writeInt(b: ByteArray, offset: Int, value: Int) {
                  b[offset] = (value and 0xFF).toByte()
                  b[offset + 1] = ((value ushr 8) and 0xFF).toByte()
                  b[offset + 2] = ((value ushr 16) and 0xFF).toByte()
                  b[offset + 3] = ((value ushr 24) and 0xFF).toByte()
              }

              private fun writeU16Stream(out: ByteArrayOutputStream, value: Int) {
                  out.write(value and 0xFF)
                  out.write((value ushr 8) and 0xFF)
              }
          }
          EOF

          # 10. إنشاء كود الواجهة ومحرك البناء والمحاذاة (ZipAlign) والتوقيع MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/mohamed/cloner/MainActivity.kt
          package com.mohamed.cloner

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInstaller
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import com.android.apksig.ApkSigner
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.FilterOutputStream
          import java.io.OutputStream
          import java.security.KeyFactory
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate
          import java.security.spec.PKCS8EncodedKeySpec
          import java.util.zip.CRC32
          import java.util.zip.ZipEntry
          import java.util.zip.ZipFile
          import java.util.zip.ZipOutputStream

          class MainActivity : Activity() {

              private lateinit var listView: ListView
              private lateinit var adapter: AppListAdapter
              private var allApps = listOf<ApplicationInfo>()
              private var filteredApps = listOf<ApplicationInfo>()

              class CountingOutputStream(out: OutputStream) : FilterOutputStream(out) {
                  var bytesWritten: Long = 0L
                      private set

                  override fun write(b: Int) {
                      out.write(b)
                      bytesWritten++
                  }

                  override fun write(b: ByteArray, off: Int, len: Int) {
                      out.write(b, off, len)
                      bytesWritten += len
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      fitsSystemWindows = true
                      setPadding(32, 96, 32, 32)
                  }

                  val titleText = TextView(this).apply {
                      text = "ناسخ التطبيقات المستقل - Android 16"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 8)
                  }
                  rootLayout.addView(titleText)

                  val subTitleText = TextView(this).apply {
                      text = "دعم كامل لـ ZipAlign (4-Byte / 16KB) وتوقيع V1/V2/V3"
                      textSize = 13f
                      setTextColor(Color.parseColor("#81C784"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  rootLayout.addView(subTitleText)

                  val buttonsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 2f
                      setPadding(0, 0, 0, 24)
                  }

                  val installedClonesBtn = createStyledButton("النسخ المثبتة", "#1E88E5").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                      setOnClickListener { showInstalledClonesDialog() }
                  }

                  val savedApksBtn = createStyledButton("ملفات APK المحفوظة", "#8E24AA").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                      setOnClickListener { showSavedApksDialog() }
                  }

                  buttonsRow.addView(installedClonesBtn)
                  buttonsRow.addView(savedApksBtn)
                  rootLayout.addView(buttonsRow)

                  val searchInput = EditText(this).apply {
                      hint = "ابحث عن التطبيق لعمل نسخة مستقلة منه..."
                      setHintTextColor(Color.parseColor("#888888"))
                      setTextColor(Color.WHITE)
                      setPadding(32, 24, 32, 24)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E1E1E"))
                          cornerRadius = 24f
                          setStroke(2, Color.parseColor("#333333"))
                      }
                  }
                  rootLayout.addView(searchInput)

                  listView = ListView(this).apply {
                      dividerHeight = 16
                      setPadding(0, 24, 0, 0)
                  }
                  rootLayout.addView(listView, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  setContentView(rootLayout)

                  loadInstalledApps()

                  searchInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          filterApps(s.toString())
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })
              }

              override fun onResume() {
                  super.onResume()
                  loadInstalledApps()
              }

              private fun createStyledButton(textStr: String, colorHex: String): Button {
                  return Button(this).apply {
                      text = textStr
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(colorHex))
                          cornerRadius = 24f
                      }
                  }
              }

              private fun loadInstalledApps() {
                  val pm = packageManager
                  val installed = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  allApps = installed.filter {
                      pm.getLaunchIntentForPackage(it.packageName) != null &&
                      it.packageName != packageName &&
                      !it.packageName.contains(".cln")
                  }.sortedBy { pm.getApplicationLabel(it).toString().lowercase() }

                  filteredApps = allApps
                  adapter = AppListAdapter()
                  listView.adapter = adapter

                  listView.setOnItemClickListener { _, _, position, _ ->
                      showCloneSetupDialog(filteredApps[position])
                  }
              }

              private fun filterApps(query: String) {
                  val pm = packageManager
                  filteredApps = if (query.isEmpty()) {
                      allApps
                  } else {
                      allApps.filter {
                          pm.getApplicationLabel(it).toString().contains(query, ignoreCase = true) ||
                          it.packageName.contains(query, ignoreCase = true)
                      }
                  }
                  adapter.notifyDataSetChanged()
              }

              private fun showCloneSetupDialog(appInfo: ApplicationInfo) {
                  val pm = packageManager
                  val origName = pm.getApplicationLabel(appInfo).toString()

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 32, 48, 16)
                  }

                  val nameLabel = TextView(this).apply {
                      text = "اسم النسخة الجديدة:"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val nameInput = EditText(this).apply {
                      setText("$origName 2")
                  }

                  val numLabel = TextView(this).apply {
                      text = "رقم النسخة (كل رقم ينشئ حزمة مختلفة):"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 24, 0, 8)
                  }

                  val cloneNumbers = (1..10).map { "نسخة رقم $it (.cln$it)" }.toTypedArray()
                  val numSpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, cloneNumbers)
                  }

                  numSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val n = position + 1
                          nameInput.setText("$origName ${n + 1}")
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  container.addView(nameLabel)
                  container.addView(nameInput)
                  container.addView(numLabel)
                  container.addView(numSpinner)

                  AlertDialog.Builder(this)
                      .setTitle("إعداد نسخ: $origName")
                      .setView(container)
                      .setPositiveButton("إنشاء وتثبيت النسخة") { _, _ ->
                          val customLabel = nameInput.text.toString().trim().ifEmpty { "$origName 2" }
                          val cloneNum = numSpinner.selectedItemPosition + 1
                          startCloningProcess(appInfo, cloneNum, customLabel)
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun writeZipEntryProperly(
                  zos: ZipOutputStream,
                  countingOut: CountingOutputStream,
                  zipFile: ZipFile,
                  sourceEntry: ZipEntry,
                  targetName: String
              ) {
                  // في أندرويد 11 إلى 16: ملف resources.arsc وملفات المكتبات .so يجب أن تكون غير مضغوطة (STORED) ومتسقة (Aligned)
                  val mustStoreUncompressed = targetName == "resources.arsc" ||
                          targetName.endsWith(".so") ||
                          sourceEntry.method == ZipEntry.STORED

                  val newEntry = ZipEntry(targetName)
                  newEntry.time = 0L

                  if (mustStoreUncompressed) {
                      val crc = CRC32()
                      var exactSize = 0L
                      val buf = ByteArray(16384)
                      zipFile.getInputStream(sourceEntry).use { input ->
                          var r: Int
                          while (input.read(buf).also { r = it } != -1) {
                              crc.update(buf, 0, r)
                              exactSize += r
                          }
                      }

                      newEntry.method = ZipEntry.STORED
                      newEntry.size = exactSize
                      newEntry.compressedSize = exactSize
                      newEntry.crc = crc.value

                      val alignment = if (targetName.endsWith(".so")) 16384L else 4L
                      val nameBytesLen = targetName.toByteArray(Charsets.UTF_8).size
                      val unalignedDataOffset = countingOut.bytesWritten + 30L + nameBytesLen
                      val rem = unalignedDataOffset % alignment
                      val pad = if (rem == 0L) 0 else (alignment - rem).toInt()
                      if (pad > 0) {
                          newEntry.extra = ByteArray(pad)
                      }
                  } else {
                      newEntry.method = ZipEntry.DEFLATED
                  }

                  zos.putNextEntry(newEntry)
                  zipFile.getInputStream(sourceEntry).use { input ->
                      input.copyTo(zos)
                  }
                  zos.closeEntry()
              }

              private fun startCloningProcess(appInfo: ApplicationInfo, cloneNum: Int, newAppLabel: String) {
                  val progressDialog = AlertDialog.Builder(this)
                      .setTitle("جاري بناء ومحاذاة النسخة...")
                      .setMessage("يرجى الانتظار، جاري تعديل الحزمة وعمل ZipAlign لـ resources.arsc وتوقيع الـ APK...")
                      .setCancelable(false)
                      .create()
                  progressDialog.show()

                  Thread {
                      try {
                          val outDir = File(getExternalFilesDir(null), "Cloned_APKs")
                          if (!outDir.exists()) outDir.mkdirs()

                          val unsignedApk = File(cacheDir, "unsigned_temp.apk")
                          if (unsignedApk.exists()) unsignedApk.delete()

                          var newPkgName = "${appInfo.packageName}.cln$cloneNum"
                          val addedEntries = HashSet<String>()
                          var maxDexIndex = 1

                          val countingOut = CountingOutputStream(BufferedOutputStream(FileOutputStream(unsignedApk)))
                          ZipOutputStream(countingOut).use { zos ->
                              // 1. معالجة ملف الـ APK الأساسي
                              ZipFile(File(appInfo.sourceDir)).use { baseZip ->
                                  val entries = baseZip.entries()
                                  while (entries.hasMoreElements()) {
                                      val entry = entries.nextElement()
                                      val name = entry.name

                                      if (isSignatureFile(name)) continue

                                      if (name.matches(Regex("classes(\\d*)\\.dex"))) {
                                          val numStr = name.removePrefix("classes").removeSuffix(".dex")
                                          val idx = if (numStr.isEmpty()) 1 else numStr.toIntOrNull() ?: 1
                                          if (idx > maxDexIndex) maxDexIndex = idx
                                      }

                                      addedEntries.add(name)

                                      if (name == "AndroidManifest.xml") {
                                          val origBytes = baseZip.getInputStream(entry).use { it.readBytes() }
                                          val (patchedBytes, pkg) = AxmlPatcher.patchManifest(origBytes, cloneNum, newAppLabel)
                                          newPkgName = pkg

                                          val manifestEntry = ZipEntry(name).apply {
                                              method = ZipEntry.DEFLATED
                                              time = 0L
                                          }
                                          zos.putNextEntry(manifestEntry)
                                          zos.write(patchedBytes)
                                          zos.closeEntry()
                                      } else {
                                          writeZipEntryProperly(zos, countingOut, baseZip, entry, name)
                                      }
                                  }
                              }

                              // 2. دمج ملفات الـ Split APKs إن وجدت مع الحفاظ على محاذاة ملفات .so
                              val splits = appInfo.splitSourceDirs
                              if (!splits.isNullOrEmpty()) {
                                  for (splitPath in splits) {
                                      ZipFile(File(splitPath)).use { splitZip ->
                                          val entries = splitZip.entries()
                                          while (entries.hasMoreElements()) {
                                              val entry = entries.nextElement()
                                              val name = entry.name

                                              if (name.startsWith("lib/") || name.startsWith("assets/")) {
                                                  if (addedEntries.add(name)) {
                                                      writeZipEntryProperly(zos, countingOut, splitZip, entry, name)
                                                  }
                                              } else if (name.matches(Regex("classes(\\d*)\\.dex"))) {
                                                  maxDexIndex++
                                                  val newDexName = "classes$maxDexIndex.dex"
                                                  if (addedEntries.add(newDexName)) {
                                                      writeZipEntryProperly(zos, countingOut, splitZip, entry, newDexName)
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          // 3. توقيع ملف الـ APK بشهادة V1 + V2 + V3
                          val safeFileName = newPkgName.replace("[^a-zA-Z0-9._]".toRegex(), "_")
                          val signedApk = File(outDir, "${safeFileName}.apk")
                          if (signedApk.exists()) signedApk.delete()

                          signApkOnDevice(unsignedApk, signedApk)
                          unsignedApk.delete()

                          runOnUiThread {
                              progressDialog.dismiss()
                              promptInstallApk(signedApk, newAppLabel, newPkgName)
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              progressDialog.dismiss()
                              AlertDialog.Builder(this@MainActivity)
                                  .setTitle("خطأ أثناء النسخ")
                                  .setMessage("التفاصيل: ${e.message}")
                                  .setPositiveButton("حسناً", null)
                                  .show()
                          }
                      }
                  }.start()
              }

              private fun isSignatureFile(name: String): Boolean {
                  if (!name.startsWith("META-INF/")) return false
                  val upper = name.uppercase()
                  return upper == "META-INF/MANIFEST.MF" ||
                          upper.endsWith(".SF") ||
                          upper.endsWith(".RSA") ||
                          upper.endsWith(".DSA") ||
                          upper.endsWith(".EC") ||
                          upper.startsWith("META-INF/SIG-")
              }

              private fun signApkOnDevice(inputApk: File, outputApk: File) {
                  val keyBytes = assets.open("cloner.pk8").use { it.readBytes() }
                  val privateKey = KeyFactory.getInstance("RSA").generatePrivate(PKCS8EncodedKeySpec(keyBytes))

                  val cert = assets.open("cloner.x509.der").use {
                      CertificateFactory.getInstance("X.509").generateCertificate(it) as X509Certificate
                  }

                  val signerConfig = ApkSigner.SignerConfig.Builder(
                      "MOHAMED_CLONER",
                      privateKey,
                      listOf(cert)
                  ).build()

                  val signer = ApkSigner.Builder(listOf(signerConfig))
                      .setInputApk(inputApk)
                      .setOutputApk(outputApk)
                      .setV1SigningEnabled(true)
                      .setV2SigningEnabled(true)
                      .setV3SigningEnabled(true)
                      .build()

                  signer.sign()
              }

              private fun promptInstallApk(apkFile: File, label: String, pkgName: String) {
                  if (!packageManager.canRequestPackageInstalls()) {
                      AlertDialog.Builder(this)
                          .setTitle("مطلوب صلاحية التثبيت")
                          .setMessage("تم تجهيز وتوقيع النسخة بنجاح!\nيرجى السماح للتطبيق بتثبيت الحزم ثم اضغط تثبيت.")
                          .setPositiveButton("منح الصلاحية") { _, _ ->
                              val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          }
                          .show()
                      return
                  }

                  AlertDialog.Builder(this)
                      .setTitle("النسخة جاهزة للتثبيت!")
                      .setMessage("الاسم: $label\nالحزمة الجديدة: $pkgName\n\nتم عمل ZipAlign والتوقيع بـ V1/V2/V3 بنجاح.")
                      .setPositiveButton("تثبيت النسخة الآن") { _, _ ->
                          installSignedApk(apkFile)
                      }
                      .setNegativeButton("لاحقاً", null)
                      .show()

                  installSignedApk(apkFile)
              }

              private fun installSignedApk(apkFile: File) {
                  try {
                      val packageInstaller = packageManager.packageInstaller
                      val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL)
                      val sessionId = packageInstaller.createSession(params)
                      val session = packageInstaller.openSession(sessionId)

                      session.openWrite("base.apk", 0, apkFile.length()).use { out ->
                          FileInputStream(apkFile).use { input ->
                              input.copyTo(out)
                          }
                          session.fsync(out)
                      }

                      val intent = Intent(this, InstallReceiver::class.java).apply {
                          setPackage(packageName)
                      }
                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getBroadcast(this, sessionId, intent, flags)
                      session.commit(pendingIntent.intentSender)
                      session.close()
                  } catch (e: Exception) {
                      Toast.makeText(this, "خطأ في بدء التثبيت: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun showInstalledClonesDialog() {
                  val pm = packageManager
                  val clones = pm.getInstalledApplications(PackageManager.GET_META_DATA).filter {
                      it.packageName.contains(".cln")
                  }

                  if (clones.isEmpty()) {
                      Toast.makeText(this, "لا توجد نسخ مثبتة حالياً", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val names = clones.map { "${pm.getApplicationLabel(it)} (${it.packageName})" }.toTypedArray()

                  AlertDialog.Builder(this)
                      .setTitle("النسخ المستقلة المثبتة على جهازك")
                      .setItems(names) { _, which ->
                          val selected = clones[which]
                          AlertDialog.Builder(this)
                              .setTitle(pm.getApplicationLabel(selected))
                              .setItems(arrayOf("فتح النسخة", "إلغاء تثبيت النسخة")) { _, action ->
                                  if (action == 0) {
                                      val launch = pm.getLaunchIntentForPackage(selected.packageName)
                                      if (launch != null) startActivity(launch)
                                  } else {
                                      val uninstall = Intent(Intent.ACTION_DELETE).apply {
                                          data = Uri.parse("package:${selected.packageName}")
                                      }
                                      startActivity(uninstall)
                                  }
                              }
                              .show()
                      }
                      .setNegativeButton("إغلاق", null)
                      .show()
              }

              private fun showSavedApksDialog() {
                  val outDir = File(getExternalFilesDir(null), "Cloned_APKs")
                  val files = outDir.listFiles()?.filter { it.name.endsWith(".apk") } ?: emptyList()

                  if (files.isEmpty()) {
                      Toast.makeText(this, "لا توجد ملفات APK محفوظة", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val fileNames = files.map { it.name }.toTypedArray()

                  AlertDialog.Builder(this)
                      .setTitle("ملفات الـ APK المستنسخة والموقعة")
                      .setItems(fileNames) { _, which ->
                          val file = files[which]
                          AlertDialog.Builder(this)
                              .setTitle(file.name)
                              .setItems(arrayOf("تثبيت النسخة", "حذف الملف")) { _, action ->
                                  if (action == 0) {
                                      installSignedApk(file)
                                  } else {
                                      file.delete()
                                      Toast.makeText(this, "تم حذف الملف", Toast.LENGTH_SHORT).show()
                                  }
                              }
                              .show()
                      }
                      .setNegativeButton("إغلاق", null)
                      .show()
              }

              inner class AppListAdapter : BaseAdapter() {
                  override fun getCount(): Int = filteredApps.size
                  override fun getItem(position: Int): Any = filteredApps[position]
                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val app = filteredApps[position]
                      val pm = packageManager

                      val row = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(24, 24, 24, 24)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#1E1E1E"))
                              cornerRadius = 20f
                          }
                      }

                      val icon = ImageView(this@MainActivity).apply {
                          setImageDrawable(pm.getApplicationIcon(app))
                          layoutParams = LinearLayout.LayoutParams(110, 110).apply {
                              setMargins(16, 0, 24, 0)
                          }
                      }

                      val textContainer = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      val nameView = TextView(this@MainActivity).apply {
                          text = pm.getApplicationLabel(app).toString()
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          typeface = Typeface.DEFAULT_BOLD
                      }

                      val pkgView = TextView(this@MainActivity).apply {
                          text = app.packageName
                          setTextColor(Color.parseColor("#9E9E9E"))
                          textSize = 12f
                      }

                      textContainer.addView(nameView)
                      textContainer.addView(pkgView)

                      row.addView(icon)
                      row.addView(textContainer)

                      return row
                  }
              }
          }
