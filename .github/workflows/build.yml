name: Build Android 16 App Cloner

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Project Files and Build APK
        run: |
          # 1. إنشاء هيكل الفولدرات
          mkdir -p app/src/main/java/com/mohamed/cloner
          mkdir -p app/src/main/res/xml

          # 2. إنشاء ملف settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MohamedCloner"
          include ':app'
          EOF

          # 3. إنشاء ملف gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          # 4. إنشاء ملف build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 5. إنشاء ملف app/build.gradle الموجه لأندرويد 16 (API 36)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohamed.cloner'
              compileSdk 36

              defaultConfig {
                  applicationId "com.mohamed.cloner"
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName "1.0-Android16"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              // استخدام مكتبات أندرويد القياسية لضمان سرعة البناء وعدم حدوث أخطاء
          }
          EOF

          # 6. إنشاء ملف سياسات العزل device_admin.xml
          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <limit-password />
              </uses-policies>
          </device-admin>
          EOF

          # 7. إنشاء ملف AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:label="ناسخ التطبيقات - محمد"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".CloneDeviceAdminReceiver"
                      android:label="محرك المساحة المزدوجة"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          # 8. إنشاء كود محرك المساحة المزدوجة CloneDeviceAdminReceiver.kt
          cat << 'EOF' > app/src/main/java/com/mohamed/cloner/CloneDeviceAdminReceiver.kt
          package com.mohamed.cloner

          import android.app.admin.DeviceAdminReceiver
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast

          class CloneDeviceAdminReceiver : DeviceAdminReceiver() {
              override fun onProfileProvisioningComplete(context: Context, intent: Intent) {
                  val manager = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val componentName = ComponentName(context.applicationContext, CloneDeviceAdminReceiver::class.java)
                  manager.setProfileName(componentName, "مساحة النسخ - محمد")
                  manager.setProfileEnabled(componentName)
                  Toast.makeText(context, "تم تفعيل المساحة المزدوجة بنجاح!", Toast.LENGTH_LONG).show()
              }
          }
          EOF

          # 9. إنشاء كود الواجهة والتطبيق الرئيسي MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/mohamed/cloner/MainActivity.kt
          package com.mohamed.cloner

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          class MainActivity : Activity() {

              private lateinit var listView: ListView
              private lateinit var adapter: AppListAdapter
              private var allApps = listOf<ApplicationInfo>()
              private var filteredApps = listOf<ApplicationInfo>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(32, 48, 32, 32)
                  }

                  // العنوان الرئيسي
                  val titleText = TextView(this).apply {
                      text = "ناسخ التطبيقات - Android 16"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  rootLayout.addView(titleText)

                  // صف الأزرار العلوية
                  val buttonsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 2f
                      setPadding(0, 0, 0, 24)
                  }

                  val workProfileBtn = createStyledButton("المساحة المزدوجة", "#1E88E5").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                      setOnClickListener { setupManagedProfile() }
                  }

                  val webSandboxBtn = createStyledButton("حاوية حسابات الويب", "#43A047").apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                      setOnClickListener { openWebSandboxDialog() }
                  }

                  buttonsRow.addView(workProfileBtn)
                  buttonsRow.addView(webSandboxBtn)
                  rootLayout.addView(buttonsRow)

                  // شريط البحث
                  val searchInput = EditText(this).apply {
                      hint = "ابحث عن تطبيق لنسخه..."
                      setHintTextColor(Color.parseColor("#888888"))
                      setTextColor(Color.WHITE)
                      setPadding(32, 24, 32, 24)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E1E1E"))
                          cornerRadius = 24f
                          setStroke(2, Color.parseColor("#333333"))
                      }
                  }
                  rootLayout.addView(searchInput)

                  // قائمة التطبيقات
                  listView = ListView(this).apply {
                      dividerHeight = 16
                      setPadding(0, 24, 0, 0)
                  }
                  rootLayout.addView(listView, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  setContentView(rootLayout)

                  loadInstalledApps()

                  searchInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          filterApps(s.toString())
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })
              }

              private fun createStyledButton(textStr: String, colorHex: String): Button {
                  return Button(this).apply {
                      text = textStr
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(colorHex))
                          cornerRadius = 24f
                      }
                  }
              }

              private fun loadInstalledApps() {
                  val pm = packageManager
                  val installed = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  allApps = installed.filter { pm.getLaunchIntentForPackage(it.packageName) != null && it.packageName != packageName }
                      .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }
                  filteredApps = allApps
                  adapter = AppListAdapter()
                  listView.adapter = adapter

                  listView.setOnItemClickListener { _, _, position, _ ->
                      showCloneOptions(filteredApps[position])
                  }
              }

              private fun filterApps(query: String) {
                  val pm = packageManager
                  filteredApps = if (query.isEmpty()) {
                      allApps
                  } else {
                      allApps.filter {
                          pm.getApplicationLabel(it).toString().contains(query, ignoreCase = true) ||
                          it.packageName.contains(query, ignoreCase = true)
                      }
                  }
                  adapter.notifyDataSetChanged()
              }

              private fun showCloneOptions(appInfo: ApplicationInfo) {
                  val pm = packageManager
                  val appName = pm.getApplicationLabel(appInfo).toString()
                  val options = arrayOf(
                      "1. نسخ في المساحة المزدوجة (Work Profile)",
                      "2. فتح إعدادات الاستنساخ المدمجة (Android 16)",
                      "3. استخراج ملف APK لعمل نسخة معدلة"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("نسخ تطبيق: $appName")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> setupManagedProfile()
                              1 -> openSystemCloneSettings(appInfo.packageName)
                              2 -> extractApkFile(appInfo, appName)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun setupManagedProfile() {
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  if (!dpm.isProvisioningAllowed(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE)) {
                      Toast.makeText(this, "المساحة المزدوجة مفعلة بالفعل على جهازك أو غير مدعومة حالياً، افتحها من قائمة التطبيقات!", Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      val intent = Intent(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE).apply {
                          val component = ComponentName(this@MainActivity, CloneDeviceAdminReceiver::class.java)
                          putExtra(DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, component)
                      }
                      startActivityForResult(intent, 1001)
                  } catch (e: Exception) {
                      Toast.makeText(this, "خطأ أثناء تشغيل المساحة المزدوجة: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun openSystemCloneSettings(pkgName: String) {
                  try {
                      val intent = Intent("android.settings.MANAGE_CLONED_APPS")
                      startActivity(intent)
                  } catch (e: Exception) {
                      try {
                          val fallback = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                              data = Uri.parse("package:$pkgName")
                          }
                          startActivity(fallback)
                          Toast.makeText(this, "تم فتح إعدادات التطبيق", Toast.LENGTH_SHORT).show()
                      } catch (ex: Exception) {
                          Toast.makeText(this, "تعذر فتح الإعدادات", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun extractApkFile(appInfo: ApplicationInfo, appName: String) {
                  try {
                      val sourceFile = File(appInfo.sourceDir)
                      val outDir = File(getExternalFilesDir(null), "Cloned_APKs")
                      if (!outDir.exists()) outDir.mkdirs()

                      val safeName = appName.replace("[^a-zA-Z0-9أ-ي]".toRegex(), "_")
                      val destFile = File(outDir, "${safeName}_clone.apk")

                      FileInputStream(sourceFile).use { input ->
                          FileOutputStream(destFile).use { output ->
                              input.copyTo(output)
                          }
                      }

                      AlertDialog.Builder(this)
                          .setTitle("تم استخراج نسخة الـ APK بنجاح!")
                          .setMessage("تم حفظ نسخة ملف التطبيق في المسار:\n\n${destFile.absolutePath}")
                          .setPositiveButton("تمام", null)
                          .show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "فشل استخراج الـ APK: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun openWebSandboxDialog() {
                  val sites = arrayOf(
                      "فيسبوك (حساب تاني)" to "https://m.facebook.com",
                      "إنستجرام (حساب تاني)" to "https://www.instagram.com",
                      "تليجرام ويب" to "https://web.telegram.org",
                      "واتساب ويب" to "https://web.whatsapp.com",
                      "منصة إكس (تويتر)" to "https://mobile.twitter.com",
                      "مسح بيانات الجلسة (لتسجيل حساب جديد)" to "CLEAR_DATA"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("حاوية الحسابات المتعددة المعزولة")
                      .setItems(sites.map { it.first }.toTypedArray()) { _, which ->
                          val selectedUrl = sites[which].second
                          if (selectedUrl == "CLEAR_DATA") {
                              CookieManager.getInstance().removeAllCookies(null)
                              CookieManager.getInstance().flush()
                              Toast.makeText(this, "تم مسح الجلسة! تقدر تسجل دخول بحساب جديد دلوقتي.", Toast.LENGTH_LONG).show()
                          } else {
                              launchSandboxWebView(selectedUrl)
                          }
                      }
                      .setNegativeButton("إغلاق", null)
                      .show()
              }

              private fun launchSandboxWebView(url: String) {
                  val dialog = AlertDialog.Builder(this).create()
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val closeBtn = Button(this).apply {
                      text = "إغلاق الحاوية والرجوع"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { dialog.dismiss() }
                  }

                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      loadUrl(url)
                  }

                  container.addView(closeBtn, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ))
                  container.addView(webView, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      1600
                  ))

                  dialog.setView(container)
                  dialog.show()
              }

              inner class AppListAdapter : BaseAdapter() {
                  override fun getCount(): Int = filteredApps.size
                  override fun getItem(position: Int): Any = filteredApps[position]
                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val app = filteredApps[position]
                      val pm = packageManager

                      val row = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(24, 24, 24, 24)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#1E1E1E"))
                              cornerRadius = 20f
                          }
                      }

                      val icon = ImageView(this@MainActivity).apply {
                          setImageDrawable(pm.getApplicationIcon(app))
                          layoutParams = LinearLayout.LayoutParams(110, 110).apply {
                              setMargins(16, 0, 24, 0)
                          }
                      }

                      val textContainer = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      val nameView = TextView(this@MainActivity).apply {
                          text = pm.getApplicationLabel(app).toString()
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          typeface = Typeface.DEFAULT_BOLD
                      }

                      val pkgView = TextView(this@MainActivity).apply {
                          text = app.packageName
                          setTextColor(Color.parseColor("#9E9E9E"))
                          textSize = 12f
                      }

                      textContainer.addView(nameView)
                      textContainer.addView(pkgView)

                      row.addView(icon)
                      row.addView(textContainer)

                      return row
                  }
              }
          }
          EOF

          # 10. بناء ملف الـ APK
          gradle assembleDebug --no-daemon

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-App-Cloner-Android16
          path: app/build/outputs/apk/debug/app-debug.apk
