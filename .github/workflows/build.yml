name: Build Work Profile Cloner
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Prep Project
        run: |
          # فك الملفات والتأكد من وجودها
          unzip app.zip -d .
          npm install --legacy-peer-deps
          npm run build
          
          # إنشاء مشروع الأندرويد وتحديث الملفات اللي أنا باعتها
          npx cap add android || true
          
          # نقل ملفات الجافا والـ Manifest اللي إحنا مجهزينها للأماكن الصح
          cp android/app/src/main/java/com/mohamed/cloner/MainActivity.java android/app/src/main/java/com/mohamed/cloner/MainActivity.java || true
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-WorkProfile
          path: "android/app/build/outputs/apk/debug/*.apk"
