name: Build Mohamed Cloner Force Open
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Prep and Build Web
        run: |
          unzip -o *.zip -d . || echo "No zip"
          npm install --legacy-peer-deps
          npm run build || (mkdir -p dist && echo "<html></html>" > dist/index.html)
          
          # إنشاء مشروع الأندرويد
          rm -rf android
          npx cap add android
          
      - name: Force Inject Launcher & Java
        run: |
          # 1. كتابة ملف المانيفست (المسؤول عن زرار الفتح) إجبارياً
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mohamed.cloner">
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Mohamed Cloner" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name="com.mohamed.cloner.MainActivity" android:exported="true" android:theme="@style/AppTheme.NoActionBarLaunch" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="app" android:host="setup-work-profile" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".MyDeviceAdminReceiver" android:label="Work Admin" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 2. كتابة ملف الجافا (المسؤول عن الأوامر) إجبارياً
          mkdir -p android/app/src/main/java/com/mohamed/cloner
          cat <<EOF > android/app/src/main/java/com/mohamed/cloner/MainActivity.java
          package com.mohamed.cloner;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Intent;
          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void startWorkProfile() {
                          Intent intent = new Intent(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE);
                          intent.putExtra(DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, new ComponentName(MainActivity.this, MyDeviceAdminReceiver.class));
                          startActivityForResult(intent, 555);
                      }
                  }, "AndroidBridge");
              }
          }
          EOF

          # 3. كتابة ملف الـ Receiver
          cat <<EOF > android/app/src/main/java/com/mohamed/cloner/MyDeviceAdminReceiver.java
          package com.mohamed.cloner;
          import android.app.admin.DeviceAdminReceiver;
          public class MyDeviceAdminReceiver extends DeviceAdminReceiver {}
          EOF

          # 4. كتابة ملف الـ XML الخاص بالآدمن
          mkdir -p android/app/src/main/res/xml
          echo '<device-admin></device-admin>' > android/app/src/main/res/xml/device_admin.xml
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-Final
          path: "android/app/build/outputs/apk/debug/*.apk"
          
