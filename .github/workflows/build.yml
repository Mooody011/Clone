name: Build Mohamed Cloner Final V3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Extract and Prep
        run: |
          unzip -o *.zip -d .
          npm install --legacy-peer-deps
          npm run build
          
          # بناء مشروع الأندرويد
          rm -rf android
          npx cap add android
          
          # إجبار السيرفر على وضع إعدادات الـ Launcher (زرار الفتح)
          # السطر ده هيدور على الملفات اللي أنا بعتهالك ويحطها في قلب الأندرويد
          find . -name "MainActivity.java" -exec cp {} android/app/src/main/java/com/mohamed/cloner/MainActivity.java \;
          find . -name "AndroidManifest.xml" -exec cp {} android/app/src/main/AndroidManifest.xml \;
          
          # تحديث المشروع
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Cloner-Final
          path: "android/app/build/outputs/apk/debug/*.apk"
          
